[project]
name = "dbimport"
# Must match VERSION in bin/common/constants.py.
version = "1.00.006"
description = "Ingest relational and NoSQL sources into Hive or Iceberg, export back, and generate Airflow DAGs"
readme = "README.rst"
license = "Apache-2.0"
requires-python = "==3.11.*"
# Versions carried over unchanged from the former
# bin/requirements_python39.txt. Packages DBImport does not use were
# removed, as were sasl and backports.zoneinfo, which do not build on
# Python 3.11 (see issue #152).
dependencies = [
    "alembic==1.13.1",
    "annotated-types==0.6.0",
    "anyio==4.3.0",
    "backports.shutil-get-terminal-size==1.0.0",
    "bcrypt==4.1.2",
    "boto3==1.34.50",
    "botocore==1.34.50",
    "certifi==2024.2.2",
    "cffi==1.16.0",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "colorama==0.4.6",
    "configparser==6.0.1",
    "cryptography==42.0.5",
    "daemons==1.3.2",
    "decorator==5.1.1",
    "dnspython==2.6.1",
    "ecdsa==0.18.0",
    "exceptiongroup==1.2.0",
    "fastapi==0.110.0",
    "future==1.0.0",
    "greenlet==3.0.3",
    "gssapi==1.8.3",
    "gunicorn==21.2.0",
    "h11==0.14.0",
    "httptools==0.6.1",
    "idna==3.6",
    "importlib-metadata==7.0.1",
    "importlib_resources==6.1.2",
    "JayDeBeApi==1.2.3",
    "jmespath==1.0.1",
    "JPype1==1.5.0",
    "kafka-python==2.0.2",
    "krb5==0.5.1",
    "Mako==1.3.2",
    "MarkupSafe==2.1.5",
    "mysql-connector-python==8.3.0",
    "numpy==1.26.4",
    "packaging==23.2",
    "pandas==2.2.1",
    "passlib==1.7.4",
    "pendulum==3.0.0",
    "protobuf==4.25.3",
    "psutil==5.9.8",
    "pure-sasl==0.6.2",
    "pure-transport==0.2.0",
    "pyasn1==0.5.1",
    "pycparser==2.21",
    "pycryptodome==3.20.0",
    "pydantic==2.6.2",
    "pydantic_core==2.16.3",
    "PyHive==0.7.0",
    "pykerberos==1.2.4",
    "pymongo==4.6.2",
    "PyMySQL==1.1.0",
    "pyspnego==0.10.2",
    "python-dateutil==2.8.2",
    "python-dotenv==1.0.1",
    "python-jose==3.3.0",
    "python-multipart==0.0.9",
    "python-pam==2.0.2",
    "pytz==2024.1",
    "PyYAML==6.0.1",
    "reprint==0.6.0",
    "requests==2.31.0",
    "requests-kerberos==0.14.0",
    "rsa==4.9",
    "s3transfer==0.10.0",
    "six==1.16.0",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.27",
    "SQLAlchemy-Utils==0.41.1",
    "sqlalchemy-views==0.3.2",
    "starlette==0.36.3",
    "thrift==0.16.0",
    "thrift-sasl==0.4.3",
    "time-machine==2.13.0",
    "typing_extensions==4.10.0",
    "tzdata==2024.1",
    "urllib3==1.26.18",
    "uvicorn==0.27.1",
    "uvloop==0.19.0",
    "watchfiles==0.21.0",
    "websockets==12.0",
    "zipp==3.17.0",
