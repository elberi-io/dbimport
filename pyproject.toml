[tool.uv]
# DBImport is not installed as a package; bin/ is run in place.
package = false
# DBImport only runs on Linux (Kerberos, /tmp paths, Hadoop tooling).
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    # Starlette 0.36.3 (via FastAPI) passes app= to httpx.Client in its
    # TestClient; httpx 0.28 removed that argument.
    "httpx>=0.27,<0.28",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
# The launchers in bin/ have no .py extension.
extend-include = [
    "bin/copy",
    "bin/deploy",
    "bin/export",
    "bin/import",
    "bin/mainServer",
    "bin/manage",
    "bin/restServer",
    "bin/setup",
]

[tool.ruff.lint]
# Existing code is checked for errors that point at real bugs (syntax
# errors, invalid comparisons, undefined names) and for import hygiene:
# no star imports, no unused or duplicate imports (#159). RUF100 reports
# noqa comments that are no longer needed, so a suppression is removed
# together with the bug it hides. tests/ruff.toml applies a stricter rule
# set to the tests.
select = ["E9", "F63", "F7", "F82", "F401", "F403", "F405", "F811", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# The Sphinx configuration is outside #159; it imports its theme.
"docs/conf.py" = ["F401"]

[tool.ruff.format]
# bin/ was formatted in one commit per package, listed in
# .git-blame-ignore-revs. The Sphinx configuration in docs/ is left as is.
exclude = ["docs/**"]

[tool.mypy]
python_version = "3.11"
files = ["tests"]
mypy_path = ["bin", "."]
explicit_package_bases = true
strict = true
# Calls from typed tests into the existing, untyped code are allowed.
untyped_calls_exclude = [
    "ConfigReader",
    "DBImportConfig",
    "DBImportOperation",
    "Schedule",
    "Server",
    "catalogService",
    "common",
    "setupOperation",
    "sourceSchemaReader",
]

[[tool.mypy.overrides]]
# Existing code has no type annotations; type errors in it are not
# reported until a module is refactored.
module = [
    "ConfigReader.*",
    "DBImportConfig.*",
    "DBImportOperation.*",
    "Schedule.*",
    "Server.*",
    "catalogService.*",
    "common.*",
    "setupOperation.*",
    "sourceSchemaReader.*",
]
ignore_errors = true

[tool.importlinter]
# The packages live in bin/, so run with bin/ on the path:
#   PYTHONPATH=bin uv run lint-imports
root_packages = [
    "ConfigReader",
    "DBImportConfig",
    "DBImportOperation",
    "Schedule",
    "Server",
    "catalogService",
    "common",
    "setupOperation",
    "sourceSchemaReader",
]

[[tool.importlinter.contracts]]
# Current layering of the existing code, highest layer first. A package
# may only import packages in the layers below it. Server and
# setupOperation do not import each other.
name = "Package layers"
type = "layers"
layers = [
    "Server | setupOperation",
    "Schedule",
    "DBImportOperation",
    "catalogService",
    "DBImportConfig",
    "sourceSchemaReader",
    "ConfigReader",
    "common",
]
ignore_imports = [
    # Existing exception: the catalog services use the Hive metastore
    # table definitions in DBImportOperation.hiveSchema.
    "catalogService.* -> DBImportOperation.hiveSchema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the shared test helpers importable as tests.configdb.
pythonpath = ["bin", "."]
addopts = ["--strict-markers"]
xfail_strict = true
markers = [
    "integration: needs the MariaDB configuration database from compose.yaml",
]
