[project]
name = "dbimport"
# Must match VERSION in bin/common/constants.py.
version = "1.00.006"
description = "Ingest relational and NoSQL sources into Hive or Iceberg, export back, and generate Airflow DAGs"
readme = "README.rst"
license = "Apache-2.0"
requires-python = "==3.11.*"
# Versions carried over unchanged from the former
# bin/requirements_python39.txt. Packages DBImport does not use were
# removed, as were sasl and backports.zoneinfo, which do not build on
# Python 3.11 (see issue #152).
dependencies = [
    "alembic==1.20.1",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "bcrypt==4.1.2",
    "boto3==1.34.50",
    "botocore==1.34.50",
    "certifi==2026.10.23",
    "cffi==1.16.0",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "cryptography==42.0.5",
    "daemons==1.3.2",
    "decorator==5.3.1",
    "dnspython==2.9.1",
    "ecdsa==0.19.2",
    "fastapi==0.110.0",
    "future==1.0.0",
    "greenlet==3.5.6",
    "gssapi==1.12.0",
    "gunicorn==21.2.0",
    "h11==0.16.0",
    "httptools==0.9.0",
    "idna==3.20",
    "JayDeBeApi==1.2.3",
    "jmespath==1.1.0",
    "JPype1==1.5.0",
    "kafka-python==2.3.3",
    "krb5==0.10.0",
    "Mako==1.3.2",
    "MarkupSafe==2.1.5",
    "mysql-connector-python==26.10.0",
    "numpy==1.26.4",
    "packaging==23.2",
    "pandas==2.2.1",
    "pendulum==3.3.0",
    "psutil==5.9.8",
    "pure-sasl==0.6.2",
    "pure-transport==0.2.0",
    "pyasn1==0.6.5",
    "pycparser==3.12",
    "pycryptodome==3.20.0",
    "pydantic==2.6.2",
    "pydantic_core==2.16.3",
    "PyHive==0.7.0",
    "pykerberos==1.2.4",
    "pymongo==4.19.0",
    "PyMySQL==1.1.0",
    "pyspnego==0.12.4",
    "python-dateutil==2.8.2",
    "python-dotenv==1.2.4",
    "python-jose==3.5.0",
    "python-multipart==0.0.32",
    "python-pam==2.1.1",
    "pytz==2026.6",
    "PyYAML==6.0.1",
    "requests==2.34.2",
    "requests-kerberos==0.15.0",
    "rsa==4.9.1",
    "s3transfer==0.10.0",
    "six==1.17.0",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.27",
    "starlette==0.36.3",
    "thrift==0.25.0",
    "thrift-sasl==0.4.3",
    "typing_extensions==4.16.0",
    "tzdata==2026.6",
    "urllib3==1.26.18",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
    "watchfiles==1.3.0",
    "websockets==12.0",
]

[tool.uv]
# DBImport is not installed as a package; bin/ is run in place.
package = false
# DBImport only runs on Linux (Kerberos, /tmp paths, Hadoop tooling).
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    # Starlette 0.36.3 (via FastAPI) passes app= to httpx.Client in its
    # TestClient; httpx 0.28 removed that argument.
    "httpx>=0.27,<0.28",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
# The launchers in bin/ have no .py extension.
extend-include = [
    "bin/copy",
    "bin/deploy",
    "bin/export",
    "bin/import",
    "bin/mainServer",
    "bin/manage",
    "bin/restServer",
    "bin/setup",
]
# Import sorting treats the packages in bin/ and the tests as first party.
src = ["bin", "."]

[tool.ruff.lint]
# One rule set for all Python code (#159). RUF100 reports noqa comments
# that are no longer needed, so a suppression is removed together with
# the bug it hides.
select = ["B", "E4", "E7", "E9", "F", "G", "I", "N", "UP", "W605", "RUF100"]
# Names that are contracts wait for the refactoring (#202): class names
# (N801, N818), class-level fields, which include the REST model fields
# and so the JSON field names of the API (N815), and module and package
# names, which are import paths (N999).
ignore = ["N801", "N815", "N818", "N999"]

[tool.ruff.lint.per-file-ignores]
# The Sphinx configuration is outside #159: it sets sys.path before its
# imports and imports its theme.
"docs/conf.py" = ["E402", "F401"]
# Existing modules that still break rules of the set, each with exactly
# the codes it breaks today (#159). Naming findings (N) are renamed in
# the steps of #202. The others need changes to logic (%-formatting,
# == None/True, bare except, unused variables), so they are fixed when
# the module is refactored, and the module's line goes. A
# module not listed here must pass the full set. Known bugs are marked
# on their line with noqa and TODO(#issue) instead.
"bin/ConfigReader/configuration.py" = ["B904", "E712", "N816"]
"bin/DBImportConfig/common_config.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "N803", "N806", "UP031"]
"bin/DBImportConfig/decryption.py" = ["B904", "E711", "E712"]
"bin/DBImportConfig/export_config.py" = ["E711", "E712", "F841", "G002", "N803", "N806", "UP031"]
"bin/DBImportConfig/export_stage.py" = ["E711", "E712", "F841", "G002", "N803", "UP031"]
"bin/DBImportConfig/import_config.py" = ["B904", "E711", "E712", "F841", "G002", "N802", "N803", "UP031"]
"bin/DBImportConfig/import_stage.py" = ["E711", "E712", "F841", "G002", "N803", "UP031"]
"bin/DBImportConfig/sendStatistics.py" = ["E711", "E712", "F841"]
"bin/DBImportOperation/atlas_operations.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "N803", "UP031"]
"bin/DBImportOperation/common_operations.py" = ["B904", "E711", "E712", "E722", "G002", "N802", "N803", "UP031"]
"bin/DBImportOperation/copy_operations.py" = ["E711", "E712", "E722", "F841", "G002", "N802", "UP031"]
"bin/DBImportOperation/etl_operations.py" = ["E711", "E712", "E722", "F841", "G002", "N803", "UP031"]
"bin/DBImportOperation/export_operations.py" = ["E711", "E712", "E722", "F841", "G002", "N802", "N803", "UP031"]
"bin/DBImportOperation/import_operations.py" = ["B904", "B905", "E711", "E712", "E722", "F841", "G002", "N802", "N803", "UP031"]
"bin/Schedule/Airflow.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "UP031"]
"bin/Server/atlasDiscovery.py" = ["E711", "E712", "E722", "F841", "G002", "N803", "UP031"]
"bin/Server/daemon.py" = ["E711", "E712", "E722", "F841", "G002", "N803", "UP031"]
"bin/Server/restServer.py" = ["B904", "E711", "E712", "N803", "N816"]
"bin/Server/restServerCalls.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "N802", "N803", "UP031"]
"bin/catalogService/glue.py" = ["B904", "E712", "F841", "N803", "UP031"]
"bin/catalogService/hiveDirect.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "N803", "N806", "UP031"]
"bin/common/sparkUDF.py" = ["E722", "F841", "N803", "N806", "N816"]
"bin/common/sparkUDF2.py" = ["E711", "E722", "N803", "N806"]
"bin/copy" = ["E711", "E712", "F841", "N802", "UP031"]
"bin/deploy" = ["E711", "E712", "F841", "N802"]
"bin/export" = ["E711", "E712", "UP031"]
"bin/import" = ["E711", "E712", "F841", "UP031"]
"bin/mainServer" = ["E712", "N803"]
"bin/manage" = ["E711", "E712", "F841", "N802", "N806"]
"bin/restServer" = ["E712", "F841", "N803", "N805"]
"bin/setup" = ["E711", "E712", "F841", "N812"]
"bin/setupOperation/database.py" = ["E711", "E722", "N812", "UP031"]
"bin/sourceSchemaReader/schemaReader.py" = ["E711", "E712", "E722", "G002", "N803", "N806", "UP031"]

[tool.ruff.format]
# bin/ was formatted in one commit per package, listed in
# .git-blame-ignore-revs. The Sphinx configuration in docs/ is left as is.
exclude = ["docs/**"]

[tool.mypy]
python_version = "3.11"
files = ["tests", "bin/common", "bin/ConfigReader"]
mypy_path = ["bin", "."]
explicit_package_bases = true
strict = true
enable_error_code = ["ignore-without-code"]
# Calls from typed tests into the existing, untyped code are allowed.
untyped_calls_exclude = [
    "DBImportConfig",
    "DBImportOperation",
    "Schedule",
    "Server",
    "catalogService",
    "setupOperation",
    "sourceSchemaReader",
]

[[tool.mypy.overrides]]
# Existing code in bin/ (packages and launchers) that has no type
# annotations yet. tests/unit/test_mypy_ratchet.py checks it with these
# settings and counts its errors against tests/fixtures/mypy_baseline.json
# (#202); when tests/ are checked, errors in these modules are not shown.
# The launchers are modules named after their file; bin/copy is checked
# on its own as __main__, because a module named copy would shadow the
# standard library.
module = [
    "DBImportConfig.*",
    "DBImportOperation.*",
    "Schedule.*",
    "SchemaUpgrade.*",
    "Server.*",
    "catalogService.*",
    "setupOperation.*",
    "sourceSchemaReader.*",
    "__main__",
    "deploy",
    "export",
    "import",
    "mainServer",
    "manage",
    "restServer",
    "setup",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
strict_equality = false
extra_checks = false

[[tool.mypy.overrides]]
# Modules in bin/ whose functions all have type hints (#202): a function
# without them fails. The other relaxed settings above still apply, and
# query results stay untyped (Any) until the data layer is rebuilt.
module = [
    "DBImportConfig.common_config",
    "DBImportConfig.decryption",
    "DBImportConfig.export_config",
    "DBImportConfig.export_stage",
    "DBImportConfig.import_config",
    "DBImportConfig.import_stage",
    "DBImportConfig.sendStatistics",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Libraries without type information. pyspark and pyspark_llap are not
# installed (they come with the cluster); sparkUDF and sparkUDF2 are
# bin/common modules that Spark imports by file name.
module = [
    "TCLIService.*",
    "boto3.*",
    "botocore.*",
    "daemons.*",
    "gunicorn.*",
    "jaydebeapi",
    "jose.*",
    "jpype.*",
    "kafka.*",
    "pam",
    "pandas.*",
    "psutil",
    "puretransport.*",
    "pyhive.*",
    "pyspark.*",
    "pyspark_llap.*",
    "requests_kerberos",
    "sparkUDF",
    "sparkUDF2",
]
ignore_missing_imports = true

[tool.importlinter]
# The packages live in bin/, so run with bin/ on the path:
#   PYTHONPATH=bin uv run lint-imports
root_packages = [
    "ConfigReader",
    "DBImportConfig",
    "DBImportOperation",
    "Schedule",
    "Server",
    "catalogService",
    "common",
    "setupOperation",
    "sourceSchemaReader",
]

[[tool.importlinter.contracts]]
# Current layering of the existing code, highest layer first. A package
# may only import packages in the layers below it. Server and
# setupOperation do not import each other.
name = "Package layers"
type = "layers"
layers = [
    "Server | setupOperation",
    "Schedule",
    "DBImportOperation",
    "catalogService",
    "DBImportConfig",
    "sourceSchemaReader",
    "ConfigReader",
    "common",
]
ignore_imports = [
    # Existing exception: the Hive catalog service uses the Hive metastore
    # table definitions in DBImportOperation.hiveSchema.
    "catalogService.hiveDirect -> DBImportOperation.hiveSchema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the shared test helpers importable as tests.configdb.
pythonpath = ["bin", "."]
addopts = ["--strict-markers"]
xfail_strict = true
markers = [
    "integration: needs the MariaDB configuration database from compose.yaml",
]
