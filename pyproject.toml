[project]
name = "dbimport"
# Must match VERSION in src/dbimport/common/constants.py.
version = "1.00.006"
description = "Ingest relational and NoSQL sources into Hive or Iceberg, export back, and generate Airflow DAGs"
readme = "README.rst"
license = "Apache-2.0"
requires-python = "==3.11.*"
# Versions carried over unchanged from the former
# bin/requirements_python39.txt. Packages DBImport does not use were
# removed, as were sasl and backports.zoneinfo, which do not build on
# Python 3.11 (see issue #152).
dependencies = [
    "alembic==1.20.1",
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "bcrypt==4.3.0",
    "boto3==1.34.50",
    "botocore==1.34.50",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "cryptography==42.0.5",
    "daemons==1.3.2",
    "decorator==5.3.1",
    "dnspython==2.9.2",
    "ecdsa==0.19.2",
    "fastapi==0.110.0",
    "future==1.0.0",
    "greenlet==3.5.6",
    "gssapi==1.12.0",
    "gunicorn==26.2.0",
    "h11==0.16.0",
    "httptools==0.9.0",
    "idna==3.20",
    "JayDeBeApi==1.2.3",
    "jmespath==1.1.0",
    "JPype1==1.5.0",
    "kafka-python==2.3.3",
    "krb5==0.10.0",
    "Mako==1.3.2",
    "MarkupSafe==2.1.5",
    "mysql-connector-python==26.10.0",
    "numpy==1.26.4",
    "packaging==26.3",
    "pandas==2.2.1",
    "pendulum==3.3.0",
    "psutil==7.2.2",
    "pure-sasl==0.6.2",
    "pure-transport==0.2.0",
    "pyasn1==0.6.5",
    "pycparser==3.12",
    "pycryptodome==3.20.0",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "pydantic-settings==2.16.3",
    "PyHive==0.7.0",
    "pykerberos==1.2.4",
    "pymongo==4.19.0",
    "PyMySQL==1.1.0",
    "pyspnego==0.12.4",
    "python-dateutil==2.8.2",
    "python-dotenv==1.2.4",
    "python-jose==3.5.0",
    "python-multipart==0.0.33",
    "python-pam==2.1.1",
    "pytz==2026.6",
    "PyYAML==6.0.1",
    "requests==2.34.2",
    "requests-kerberos==0.15.0",
    "rsa==4.9.1",
    "s3transfer==0.10.0",
    "six==1.17.0",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.27",
    "starlette==0.36.3",
    "thrift==0.25.0",
    "thrift-sasl==0.4.3",
    "typing_extensions==4.16.0",
    "typing-inspection==0.4.5",
    "tzdata==2026.6",
    "urllib3==1.26.18",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
    "watchfiles==1.3.0",
    "websockets==12.0",
]

[project.scripts]
dbimport-copy = "dbimport.cli.copy_cli:run"
dbimport-deploy = "dbimport.cli.deploy_cli:run"
dbimport-export = "dbimport.cli.export_cli:run"
dbimport-import = "dbimport.cli.import_cli:run"
dbimport-main-server = "dbimport.cli.main_server_cli:run"
dbimport-manage = "dbimport.cli.manage_cli:run"
dbimport-rest-server = "dbimport.cli.rest_server_cli:run"
dbimport-setup = "dbimport.cli.setup_cli:run"

[build-system]
# The package lives in src/dbimport; the launchers in bin/ import it.
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
# DBImport only runs on Linux (Kerberos, /tmp paths, Hadoop tooling).
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    # Starlette 0.36.3 (via FastAPI) passes app= to httpx.Client in its
    # TestClient; httpx 0.28 removed that argument.
    "httpx>=0.27,<0.28",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
# The launchers in bin/ have no .py extension.
extend-include = [
    "bin/copy",
    "bin/deploy",
    "bin/export",
    "bin/import",
    "bin/mainServer",
    "bin/manage",
    "bin/restServer",
    "bin/setup",
]
# Import sorting treats the dbimport package and the tests as first party.
src = ["src", "."]

[tool.ruff.lint]
# One rule set for all Python code (#159). RUF100 reports noqa comments
# that are no longer needed, so a suppression is removed together with
# the bug it hides.
select = ["B", "E4", "E7", "E9", "F", "G", "I", "N", "UP", "W605", "RUF010", "RUF100"]
# Class-level fields wait for the refactoring (#238): they include the ORM
# attributes and the REST model fields, which are the JSON field names of
# the API (N815).
ignore = ["N815"]

[tool.ruff.lint.per-file-ignores]
# The Sphinx configuration is outside #159: it sets sys.path before its
# imports and imports its theme.
"docs/conf.py" = ["E402", "F401"]
# Existing modules that still break rules of the set, each with exactly
# the codes it breaks today (#159). Naming findings (N) are renamed in
# the steps of #202. The others need changes to logic (%-formatting,
# == None/True, bare except, unused variables), so they are fixed when
# the module is refactored, and the module's line goes. A
# module not listed here must pass the full set. Known bugs are marked
# on their line with noqa and TODO(#issue) instead.
"src/dbimport/config_reader/configuration.py" = ["B904", "E712"]
"src/dbimport/config_db/common_config.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/config_db/decryption.py" = ["B904", "E711"]
"src/dbimport/config_db/export_config.py" = ["E711", "E712", "F841", "G002", "UP031"]
"src/dbimport/config_db/export_stage.py" = ["E711", "E712", "F841", "G002", "UP031"]
"src/dbimport/config_db/import_config.py" = ["B904", "E711", "E712", "F841", "G002", "UP031"]
"src/dbimport/config_db/import_stage.py" = ["E711", "E712", "F841", "G002", "UP031"]
"src/dbimport/config_db/send_statistics.py" = ["E711", "E712", "F841"]
"src/dbimport/operations/atlas_operations.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/operations/common_operations.py" = ["B904", "E711", "E712", "E722", "G002", "UP031"]
"src/dbimport/operations/copy_operations.py" = ["E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/operations/etl_operations.py" = ["E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/operations/export_operations.py" = ["E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/operations/import_operations.py" = ["B904", "B905", "E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/schedule/airflow_dags.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/server/atlas_discovery.py" = ["E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/server/daemon.py" = ["E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/server/rest_server.py" = ["B904", "E711", "E712", "N803"]
"src/dbimport/server/rest_server_calls.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/catalog/glue.py" = ["B904", "E712", "F841", "UP031"]
"src/dbimport/catalog/hive_direct.py" = ["B904", "E711", "E712", "E722", "F841", "G002", "UP031"]
"src/dbimport/common/spark_udf.py" = ["E722"]
"src/dbimport/common/spark_udf2.py" = ["E711", "E722"]
"src/dbimport/cli/copy_cli.py" = ["F841", "UP031"]
"src/dbimport/cli/deploy_cli.py" = ["F841"]
"src/dbimport/cli/export_cli.py" = ["E712", "UP031"]
"src/dbimport/cli/import_cli.py" = ["E711", "E712", "F841", "UP031"]
"src/dbimport/cli/manage_cli.py" = ["E711", "E712", "F841"]
"src/dbimport/cli/rest_server_cli.py" = ["F841"]
"src/dbimport/cli/setup_cli.py" = ["F841"]
"src/dbimport/setup/database.py" = ["E711", "E722", "UP031"]
"src/dbimport/source_schema/schema_reader.py" = ["E711", "E722", "G002", "UP031"]

[tool.ruff.format]
# bin/ was formatted in one commit per package, listed in
# .git-blame-ignore-revs. The Sphinx configuration in docs/ is left as is.
exclude = ["docs/**"]

[tool.mypy]
python_version = "3.11"
files = ["tests", "src/dbimport/common", "src/dbimport/config_reader", "src/dbimport/settings.py"]
mypy_path = ["src", "."]
explicit_package_bases = true
strict = true
enable_error_code = ["ignore-without-code"]
# Calls from typed tests into the existing, untyped code are allowed.
untyped_calls_exclude = [
    "dbimport.cli",
    "dbimport.config_db",
    "dbimport.operations",
    "dbimport.schedule",
    "dbimport.server",
    "dbimport.catalog",
    "dbimport.setup",
    "dbimport.source_schema",
]

[[tool.mypy.overrides]]
# Existing code (dbimport packages and bin/ launchers) that has no type
# annotations yet. tests/unit/test_mypy_ratchet.py checks it with these
# settings and counts its errors against tests/fixtures/mypy_baseline.json
# (#202); when tests/ are checked, errors in these modules are not shown.
# The launchers are modules named after their file; bin/copy is checked
# on its own as __main__, because a module named copy would shadow the
# standard library.
module = [
    "dbimport.cli.*",
    "dbimport.config_db.*",
    "dbimport.operations.*",
    "dbimport.schedule.*",
    "dbimport.migrations.*",
    "dbimport.server.*",
    "dbimport.catalog.*",
    "dbimport.setup.*",
    "dbimport.source_schema.*",
    "__main__",
    "deploy",
    "export",
    "import",
    "mainServer",
    "manage",
    "restServer",
    "setup",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
strict_equality = false
extra_checks = false

[[tool.mypy.overrides]]
# Modules whose functions all have type hints (#202): a function
# without them fails. The other relaxed settings above still apply, and
# query results stay untyped (Any) until the data layer is rebuilt.
module = [
    "dbimport.config_db.common_config",
    "dbimport.config_db.decryption",
    "dbimport.config_db.export_config",
    "dbimport.config_db.export_stage",
    "dbimport.config_db.import_config",
    "dbimport.config_db.import_stage",
    "dbimport.config_db.send_statistics",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Libraries without type information. pyspark and pyspark_llap are not
# installed (they come with the cluster); spark_udf and spark_udf2 are
# dbimport.common modules that Spark imports by file name.
module = [
    "TCLIService.*",
    "boto3.*",
    "botocore.*",
    "daemons.*",
    "gunicorn.*",
    "jaydebeapi",
    "jose.*",
    "jpype.*",
    "kafka.*",
    "pam",
    "pandas.*",
    "psutil",
    "puretransport.*",
    "pyhive.*",
    "pyspark.*",
    "pyspark_llap.*",
    "requests_kerberos",
    "spark_udf",
    "spark_udf2",
]
ignore_missing_imports = true

[tool.importlinter]
root_package = "dbimport"

[[tool.importlinter.contracts]]
# Current layering of the existing code, highest layer first. A package
# may only import packages in the layers below it. cli holds the command
# line programs; server and setup do not import each other.
name = "Package layers"
type = "layers"
containers = ["dbimport"]
layers = [
    "cli",
    "server | setup",
    "schedule",
    "operations",
    "catalog",
    "config_db",
    "source_schema",
    "config_reader | settings",
    "common",
]
ignore_imports = [
    # Existing exception: the Hive catalog service uses the Hive metastore
    # table definitions in operations.hive_schema.
    "dbimport.catalog.hive_direct -> dbimport.operations.hive_schema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the shared test helpers importable as tests.configdb; the
# dbimport package itself is installed into the environment by uv sync.
pythonpath = ["."]
addopts = ["--strict-markers"]
xfail_strict = true
markers = [
    "integration: needs the MariaDB configuration database from compose.yaml",
]
